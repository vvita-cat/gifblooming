<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library/build/nn.min.js"></script>
<script>
  let flowerColor, backgroundColor

  function setup () {
    flowerColor = nn.randomColor()
    backgroundColor = nn.randomColor()

    let attempts = 0
    while (nn.colorContrast(flowerColor, backgroundColor) < 3 && attempts < 100) {
      flowerColor = nn.randomColor()
      attempts++
    }

    nn.get('body')
      .content('Blooming Flowers')
      .css({
        color: flowerColor,
        background: backgroundColor,
        overflow: 'hidden',
        height: '100vh',
        margin: 0,
        display: 'grid',
        alignItems: 'center',
        justifyContent: 'center',
        fontSize: 72,
        fontFamily: 'sans-serif',
        userSelect: 'none'
      })

    nn.times(60, createGif)
  }

  function createGif () {
    const x = nn.random(-50, nn.width - 50)
    const y = nn.random(-50, nn.height - 50)
    const r = nn.random(360)
    const c = nn.toHSL(flowerColor)

    nn.create('img')
      .set('src', 'flower.gif')
      .size(75, 75)
      .addTo('body')
      .position(x, y)
      .rotate(r)
      .hueRotate(c.h - 60)
      .saturate(c.s / 100)
      .brightness(Math.max(0.4, c.l / 50))
      .css({
        cursor: 'pointer',
        userSelect: 'none',
        transition: 'all 1.5s ease-out'
      })
      .on('click', function (e) {
        e.stopPropagation()
      })
      .on('mouseover', async function () {
        this.css({ pointerEvents: 'none', opacity: 0 })
        this.scale(3)
        this.rotate(r - 180)
        await nn.sleep(1500)
        this.remove()
      }, { once: true })
  }

 function update () {
    nn.getAll('img').forEach(img => img.remove())
    setup()
  }

  nn.on('load', setup)
  nn.on('click', update)
</script>
