
<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library/build/nn.min.js"></script>
<script>
  /* global nn */
  let flowerColor, backgroundColor

  function setup () {
    // pick two random colors
    flowerColor = nn.randomColor()
    backgroundColor = nn.randomColor()

    // change minimum contrast ratio to 3
    while (nn.colorContrast(flowerColor, backgroundColor) < 3) {
      flowerColor = nn.randomColor()
    }

    // update body's content and styles
    nn.get('body')
      .content('Blooming Flowers')
      .css({
        color: flowerColor,
        background: backgroundColor,
        overflow: 'hidden',
        height: '100vh',
        display: 'grid',
        alignItems: 'center',
        justifyContent: 'center',
        fontSize: 72
      })

    // run the createGif function 60 times
    nn.times(60, createGif)
  }

  function createGif () {
    // create a random x,y position
    const x = nn.random(-100, nn.width + 100)
    const y = nn.random(-100, nn.height + 100)
    const r = nn.random(360)
    const c = nn.toHSL(flowerColor)

    // create an img element for our flower gif
    nn.create('img')
      .set('src', 'flower.gif')
      .addTo('body')
      .position(x, y)
      .rotate(r)
      .hueRotate(60 - c.h)
      .saturate(c.s / 100)
      .brightness(c.l / 100)
      .css({
        cursor: 'grab',
        userSelect: 'none',
        transition: 'all 1.5s ease-out'
      })
      .on('mouseover', async function () {
        this.scale(3)
        this.css('opacity', 0)
        this.rotate(r - 180)
        await nn.sleep(1500)
        this.remove()
      })
  }

  function update () {
    nn.getAll('img').forEach(img => img.remove())
    setup()
  }

  nn.on('load', setup)
  nn.on('click', update)
</script>
