
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/p5.min.js"></script>
<script>
  /* global p5 */
  const sketch = (p) => {
    p.setup = () => {
      p.createCanvas(800, 500)
      p.background(255, 182, 193)
    }

    p.draw = () => {
      p.fill(255, 215, 0)
      p.rect(p.mouseX, p.mouseY, 50, 50)
    }
  }
  new p5(sketch)
</script>
